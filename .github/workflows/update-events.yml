name: Update foreign sports events

on:
  schedule:
    - cron: "0 */3 * * *"   # 每 3 小时更新一次(UTC),可自行修改
  workflow_dispatch:         # 允许在 Actions 页面手动运行
  push:
    paths:
      - "update_events.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert events.m3u8 and update tv.txt
        run: python update_events.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv.txt
          git diff --cached --quiet || (git commit -m "Auto update 国外体育 events" && git push)
